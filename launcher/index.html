<!doctype html>
<html lang="it" data-perf="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080,initial-scale=1,user-scalable=no">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Archivo:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   HOME — launcher webOS, impianto da tv box
   In alto lo scaffale: racconta l'app a fuoco, con le uscite della settimana
   quando ci sono. Sotto, i riquadri 16:9 delle app: quello a fuoco si
   solleva, prende luce e mostra il nome. La stanza e' buia, lo schermo
   irradia dai bordi il colore dell'app scelta.
   Regola di tutto il file: si animano solo transform e opacity.
   ========================================================================== */
:root{
  color-scheme:dark;
  --void:#06070e;
  --ink:#f1f3fb;
  --ink-2:rgba(241,243,251,.68);
  --ink-3:rgba(241,243,251,.42);
  --line:rgba(255,255,255,.13);
  --accent:#ff5470;
  --accent-soft:rgba(255,84,112,.38);
  --accent-tint:rgba(255,84,112,.15);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --ui:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --u:calc(100vw / 1920);           /* 1u = 1/1920 della larghezza, da JS */
  --safe:calc(84 * var(--u));
  --cols:6;
}
*{margin:0;padding:0;box-sizing:border-box}
button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;
  -webkit-appearance:none;appearance:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void)}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--void)}

/* ---------- sfondo ------------------------------------------------------ */
#sky{position:absolute;inset:0;z-index:0;
  background:radial-gradient(140% 100% at 50% -10%, #121a36 0%, #06070e 60%)}
.orb{position:absolute;border-radius:50%;will-change:transform;transform:translate3d(0,0,0)}
.o1{width:calc(1240*var(--u));height:calc(1240*var(--u));left:-14%;top:-30%;
  background:radial-gradient(circle at 50% 50%, var(--accent) 0%,
    var(--accent-soft) 36%, var(--accent-tint) 58%, rgba(0,0,0,0) 77%);
  animation:o1 32s ease-in-out infinite}
.o2{width:calc(1120*var(--u));height:calc(1120*var(--u));right:-16%;top:-2%;
  background:radial-gradient(circle at 50% 50%, #3d7bff 0%, rgba(61,123,255,.40) 36%,
    rgba(61,123,255,.11) 58%, rgba(0,0,0,0) 77%);
  animation:o2 40s ease-in-out infinite}
.o3{width:calc(1320*var(--u));height:calc(1320*var(--u));left:20%;bottom:-46%;
  background:radial-gradient(circle at 50% 50%, #8b5cf6 0%, rgba(139,92,246,.36) 36%,
    rgba(139,92,246,.10) 58%, rgba(0,0,0,0) 77%);
  animation:o3 47s ease-in-out infinite}
@keyframes o1{0%,100%{transform:translate3d(0,0,0) scale(1)}
  34%{transform:translate3d(16vw,10vh,0) scale(1.15)}
  67%{transform:translate3d(5vw,20vh,0) scale(.92)}}
@keyframes o2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}
  40%{transform:translate3d(-18vw,14vh,0) scale(.88)}
  72%{transform:translate3d(-7vw,-8vh,0) scale(1.17)}}
@keyframes o3{0%,100%{transform:translate3d(0,0,0) scale(.95)}
  45%{transform:translate3d(18vw,-15vh,0) scale(1.18)}
  76%{transform:translate3d(-10vw,-5vh,0) scale(1.02)}}
/* alone ai bordi nel colore dell'app a fuoco: due strati che si scambiano in
   dissolvenza, cosi' non si interpola mai un'ombra grande quanto lo schermo */
.spill{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;
  transition:opacity .55s ease;will-change:opacity}
.spill.on{opacity:1}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    linear-gradient(180deg,rgba(4,5,10,.0) 30%,rgba(4,5,10,.62) 100%),
    radial-gradient(130% 100% at 50% 40%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%)}

/* ---------- riposo ------------------------------------------------------ */
#saver{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:calc(10*var(--u));
  opacity:0;pointer-events:none;transition:opacity 1.1s ease}
#saverClock{font-family:var(--display);font-size:calc(210*var(--u));font-weight:500;
  line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  text-shadow:0 calc(20*var(--u)) calc(60*var(--u)) rgba(0,0,0,.6)}
#saverDate{font-size:calc(30*var(--u));color:var(--ink-2);text-transform:capitalize;letter-spacing:.06em}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  transition:opacity 1.1s ease}
html.idle #app{opacity:0;pointer-events:none}
html.idle #saver{opacity:1}

/* ---------- barra in alto ----------------------------------------------- */
#bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:calc(30*var(--u));padding:calc(40*var(--u)) var(--safe) calc(18*var(--u))}
#date{font-size:calc(22*var(--u));color:var(--ink-2);text-transform:capitalize;font-weight:500}
.right{display:flex;align-items:center;justify-content:flex-end;gap:calc(24*var(--u))}
.wx{display:flex;align-items:center;gap:calc(9*var(--u));font-size:calc(22*var(--u));color:var(--ink-2)}
.wx svg{width:calc(26*var(--u));height:calc(26*var(--u))}
.wx b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
#clock{font-family:var(--display);font-size:calc(40*var(--u));font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
#modes{position:relative;display:inline-flex;gap:calc(4*var(--u));padding:calc(5*var(--u));
  border-radius:999px;background:rgba(10,13,23,.55);border:1px solid var(--line)}
#thumb{position:absolute;top:calc(5*var(--u));left:0;height:calc(50*var(--u));border-radius:999px;
  background:var(--mc);box-shadow:0 0 calc(30*var(--u)) var(--mc);
  transition:transform .3s cubic-bezier(.3,.9,.3,1),width .3s cubic-bezier(.3,.9,.3,1),background .3s ease;
  will-change:transform,width}
.mode{position:relative;z-index:1;display:flex;align-items:center;gap:calc(10*var(--u));
  height:calc(50*var(--u));padding:0 calc(24*var(--u));border-radius:999px;
  font-size:calc(22*var(--u));font-weight:600;color:var(--ink-3);
  transition:color .25s ease;white-space:nowrap}
.mode .dot{width:calc(11*var(--u));height:calc(11*var(--u));border-radius:50%;background:var(--c);
  transition:opacity .25s ease}
.mode.on{color:#0a0c14}
.mode.on .dot{opacity:0}

/* ---------- area che scorre --------------------------------------------- */
#port{flex:1;min-height:0;overflow:hidden;position:relative;padding:0 var(--safe)}
#scroll{position:relative;will-change:transform;
  transition:transform .36s cubic-bezier(.2,.8,.2,1)}

/* ---------- scaffale ---------------------------------------------------- */
#shelf{height:calc(392*var(--u));display:flex;align-items:flex-end;gap:calc(40*var(--u));
  padding-bottom:calc(40*var(--u));transition:opacity .3s ease}
#shelf.away{opacity:0}
.sh-copy{flex:none;width:calc(600*var(--u));min-width:0}
#shCap{display:flex;align-items:center;gap:calc(10*var(--u));font-size:calc(18*var(--u));
  letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
#shCap i{width:calc(10*var(--u));height:calc(10*var(--u));border-radius:50%;background:var(--sc);
  box-shadow:0 0 calc(14*var(--u)) var(--sc)}
#shTitle{font-family:var(--display);font-weight:800;font-size:calc(88*var(--u));line-height:.96;
  letter-spacing:-.03em;margin-top:calc(12*var(--u));text-wrap:balance}
#shSub{font-size:calc(24*var(--u));line-height:1.35;color:var(--ink-2);margin-top:calc(14*var(--u));
  max-width:calc(520*var(--u))}
.sh-row{flex:1;min-width:0;display:flex;gap:calc(18*var(--u));justify-content:flex-end;
  align-items:flex-end;height:calc(300*var(--u))}
.swap{animation:swap .26s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translate3d(0,calc(14*var(--u)),0)}to{opacity:1;transform:none}}
.poster{flex:none;position:relative;width:calc(186*var(--u));height:calc(279*var(--u));
  border-radius:calc(18*var(--u));overflow:hidden;
  background:linear-gradient(165deg,var(--sc-mid) 0%,#0b0d18 92%);
  box-shadow:inset 0 0 0 1px var(--line),0 calc(22*var(--u)) calc(40*var(--u)) calc(-20*var(--u)) rgba(0,0,0,.8);
  display:flex;flex-direction:column;justify-content:flex-end;padding:calc(14*var(--u))}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .4s ease}
.poster img.ok{opacity:1}
.poster::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0) 46%,rgba(0,0,0,.82) 100%)}
.poster b,.poster span{position:relative;z-index:1}
.poster b{font-size:calc(18*var(--u));font-weight:600;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.poster span{font-size:calc(14*var(--u));color:var(--ink-2);margin-top:calc(4*var(--u))}
.art{flex:none;width:calc(480*var(--u));aspect-ratio:16/9;border-radius:calc(40*var(--u));
  position:relative;overflow:hidden;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 calc(40*var(--u)) calc(80*var(--u)) calc(-30*var(--u)) rgba(0,0,0,.85)}
.art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(125deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.art svg{width:30%;height:auto;max-height:56%;color:var(--fg);fill:currentColor}
.art svg.line{fill:none}
.art .word{font-size:calc(62*var(--u))}

/* ---------- riquadri ---------------------------------------------------- */
#grid{position:relative;display:grid;grid-template-columns:repeat(var(--cols),1fr);
  column-gap:calc(34*var(--u));row-gap:calc(78*var(--u));padding-bottom:calc(420*var(--u))}
.tile{position:relative;aspect-ratio:16/9;border-radius:calc(30*var(--u));
  transform:translateZ(0);
  transition:transform .18s cubic-bezier(.2,.8,.2,1);will-change:transform}
/* ombra e bordo di luce: disegnati una volta, si accendono con l'opacity */
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:0 0 0 calc(3*var(--u)) rgba(255,255,255,.92),
             0 calc(34*var(--u)) calc(60*var(--u)) calc(-16*var(--u)) rgba(0,0,0,.85),
             0 0 calc(70*var(--u)) calc(-10*var(--u)) var(--sc);
  opacity:0;transition:opacity .18s ease;will-change:opacity}
.face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.face svg{width:32%;height:auto;max-height:58%;color:var(--fg);fill:currentColor;display:block}
.face svg.line{fill:none}
.face img{width:62%;height:62%;object-fit:contain;display:block}
.word{font-family:var(--display);font-weight:800;font-size:calc(34*var(--u));color:var(--fg);
  letter-spacing:-.025em;line-height:1;text-align:center;padding:0 calc(14*var(--u))}
.word small{display:block;font-family:var(--ui);font-weight:600;font-size:.42em;letter-spacing:.2em;
  text-transform:uppercase;opacity:.75;margin-top:.5em}
.shine{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.32),rgba(255,255,255,0) 44%);
  opacity:0;transition:opacity .18s ease}
.label{position:absolute;left:calc(-30*var(--u));right:calc(-30*var(--u));
  top:calc(100% + 22*var(--u));text-align:center;font-size:calc(21*var(--u));font-weight:600;
  white-space:nowrap;opacity:0;transition:opacity .18s ease;pointer-events:none}
.tile.focus{z-index:5;
  transform:perspective(calc(1100*var(--u))) translate3d(0,calc(-8*var(--u)),0) scale(1.13)
            rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.tile.focus::before,.tile.focus .shine,.tile.focus .label{opacity:1}
.tile.go{animation:go .34s ease}
@keyframes go{45%{transform:perspective(calc(1100*var(--u))) scale(1.04)}}

/* ---------- stato e avvisi ---------------------------------------------- */
#status{position:absolute;right:var(--safe);bottom:calc(26*var(--u));z-index:3;display:flex;
  gap:calc(14*var(--u));align-items:center;font-size:calc(15*var(--u));letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-3)}
#sndTag{font-size:calc(19*var(--u));letter-spacing:0;transition:opacity .2s ease}
#sndTag.off{opacity:.3}
#toast{position:absolute;left:50%;bottom:calc(70*var(--u));z-index:6;
  transform:translate3d(-50%,calc(20*var(--u)),0);opacity:0;pointer-events:none;
  padding:calc(14*var(--u)) calc(28*var(--u));border-radius:999px;
  background:rgba(14,17,29,.92);border:1px solid var(--line);
  font-size:calc(22*var(--u));font-weight:500;white-space:nowrap;
  transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1)}
#toast.on{opacity:1;transform:translate3d(-50%,0,0)}

/* ---------- schermo stretto (anteprima sul telefono) -------------------- */
html.portrait{--cols:3;--safe:calc(40*var(--u))}
html.portrait #bar{grid-template-columns:1fr auto;row-gap:calc(22*var(--u))}
html.portrait #modes{grid-column:1 / -1;grid-row:2;justify-self:center}
html.portrait .mode{padding:0 calc(18*var(--u))}
html.portrait #shelf{height:auto;flex-direction:column;align-items:flex-start;gap:calc(26*var(--u))}
html.portrait .sh-copy{width:100%}
html.portrait #shTitle{font-size:calc(74*var(--u))}
html.portrait .sh-row{flex:none;width:100%;justify-content:flex-start;height:auto;overflow:hidden}
html.portrait .art{width:calc(420*var(--u))}

/* ---------- resa -------------------------------------------------------- */
html[data-perf="static"] .orb{animation:none}
html[data-perf="static"] .o3{display:none}
@media (prefers-reduced-motion:reduce){ .orb{animation:none!important} }
</style>
</head>
<body>
<div id="stage">
  <div id="sky"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
  <div class="spill" id="spillA"></div>
  <div class="spill" id="spillB"></div>
  <div id="vignette"></div>

  <div id="saver"><div id="saverClock">--:--</div><div id="saverDate"></div></div>

  <div id="app">
    <header id="bar">
      <div id="date"></div>
      <nav id="modes"><div id="thumb"></div></nav>
      <div class="right">
        <div class="wx"><span id="wxIcon"></span><b id="wxTemp">--&deg;</b><span id="wxDesc"></span></div>
        <div id="clock">--:--</div>
      </div>
    </header>

    <div id="port">
      <div id="scroll">
        <section id="shelf">
          <div class="sh-copy" id="shCopy">
            <div id="shCap"><i></i><span id="shCapTxt"></span></div>
            <h1 id="shTitle"></h1>
            <p id="shSub"></p>
          </div>
          <div class="sh-row" id="shRow"></div>
        </section>
        <main id="grid"></main>
      </div>
    </div>
  </div>

  <div id="status"><span id="perfTag"></span><span id="sndTag">&#9834;</span></div>
  <div id="toast"></div>
</div>

<script src="webOSTV.js"></script>
<script src="icons.js"></script>
<script>
"use strict";

/* ==========================================================================
   CONFIG — tutto cio' che vorrai cambiare sta qui.
   ========================================================================== */

/* Meteo: Open-Meteo, gratis e senza chiave. Cambia qui la tua citta'. */
var PLACE = { name:"Roma", lat:41.9028, lon:12.4964 };

/* Segni disegnati a mano per cio' che non ha un'icona nella raccolta. */
var MARKS = {
  tv:'<svg class="line" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="13.5" rx="3"/><path d="M8 2.6l4 4.2 4-4.2"/></svg>',
  wave:'<svg class="line" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="2.3" fill="currentColor" stroke="none"/><path d="M7.9 8.3a5.4 5.4 0 0 0 0 7.4M16.1 8.3a5.4 5.4 0 0 1 0 7.4"/><path d="M5 5.2a9.8 9.8 0 0 0 0 13.6M19 5.2a9.8 9.8 0 0 1 0 13.6"/></svg>',
  racket:'<svg class="line" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14.6" cy="8.2" rx="5.4" ry="6.6" transform="rotate(38 14.6 8.2)"/><path d="M10.9 12.9L8.6 15.8M8.6 15.8l-4.9 5.5" stroke-width="2.6"/><path d="M11.6 5.2l6.3 5.6M10.4 7.9l5.9 5.2M13.4 3.3l5.6 5M17.3 3.5l-5.9 8.3M19.4 6.1l-5.2 7.3M14.6 2.6l-4.4 6.2" stroke-width=".8" opacity=".7"/><circle cx="5.2" cy="6.2" r="1.9" fill="currentColor" stroke="none"/></svg>',
  plug:'<svg class="line" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5h18v4.2l-2.6 3.8H5.6L3 12.7z"/><path d="M8 12h8"/></svg>',
  globe:'<svg class="line" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4M12 2.8c2.8 2.6 4 5.8 4 9.2s-1.2 6.6-4 9.2c-2.8-2.6-4-5.8-4-9.2s1.2-6.6 4-9.2z"/></svg>'
};

/* Le app.
   icon   nome di un'icona in icons.js (Simple Icons, CC0)
   mark   un segno disegnato qui sopra
   word   niente icona: il nome scritto, come fanno molte app sulle tv box
   logo   un tuo file in logos/, vince su tutto il resto
   ids    identificativi dell'app nativa su webOS, provati in ordine
   find   come riconoscerla se la TV concede l'elenco delle app installate
   url    dove andare col browser della TV se l'app nativa non parte
   tvmaze nomi del servizio su TVMaze, per le uscite della settimana       */
var APPS = {
  netflix:  { name:"Netflix", kind:"Film e serie", sub:"Serie, film e show originali.",
              icon:"netflix", bg:"#0b0b0d", fg:"#e50914", color:"#e50914",
              ids:["netflix"], find:["netflix"], url:"https://www.netflix.com/", tvmaze:["Netflix"] },
  youtube:  { name:"YouTube", kind:"Video", sub:"Tutto quello che esce, da chiunque.",
              icon:"youtube", bg:"#ffffff", fg:"#ff0033", color:"#ff3b30",
              ids:["youtube.leanback.v4"], find:["youtube"], url:"https://www.youtube.com/tv", tvmaze:["YouTube"] },
  prime:    { name:"Prime Video", kind:"Film e serie", sub:"Film, serie e sport inclusi con Prime.",
              word:"prime video", bg:"linear-gradient(140deg,#0f79af,#1399ff)", fg:"#ffffff", color:"#1a98ff",
              ids:["amazon"], find:["prime video","amazon"], url:"https://www.primevideo.com/", tvmaze:["Prime Video"] },
  disney:   { name:"Disney+", kind:"Film e serie", sub:"Disney, Pixar, Marvel, Star Wars e altro.",
              word:"Disney+", bg:"linear-gradient(150deg,#0a1a52,#113ccf)", fg:"#ffffff", color:"#2f6bff",
              ids:["com.disney.disneyplus-prod"], find:["disney"], url:"https://www.disneyplus.com/", tvmaze:["Disney+"] },
  appletv:  { name:"Apple TV", kind:"Film e serie", sub:"Gli originali Apple e il tuo catalogo.",
              icon:"appletv", bg:"linear-gradient(160deg,#2b2d33,#0c0d10)", fg:"#ffffff", color:"#a8b0c2",
              ids:["com.apple.appletv"], find:["apple tv"], url:"https://tv.apple.com/", tvmaze:["Apple TV","Apple TV+"] },
  raiplay:  { name:"RaiPlay", kind:"Tv italiana", sub:"Dirette e programmi Rai, gratis.",
              word:"RaiPlay", bg:"linear-gradient(140deg,#0a2f7a,#2f6fe0)", fg:"#ffffff", color:"#4f7cff",
              find:["raiplay","rai play"], url:"https://www.raiplay.it/" },
  infinity: { name:"Mediaset Infinity", kind:"Tv italiana", sub:"Canali Mediaset, film e serie.",
              word:"Infinity", bg:"linear-gradient(140deg,#3b1a8f,#8b5cf6)", fg:"#ffffff", color:"#8b5cf6",
              find:["mediaset","infinity"], url:"https://mediasetinfinity.mediaset.it/" },
  pluto:    { name:"Pluto TV", kind:"Canali gratuiti", sub:"Centinaia di canali, senza abbonamento.",
              word:"pluto tv", bg:"#0d0d10", fg:"#ffd23f", color:"#ffc44d",
              find:["pluto"], url:"https://pluto.tv/it/live-tv" },
  twitch:   { name:"Twitch", kind:"Dirette", sub:"Giochi, chiacchiere e musica in diretta.",
              icon:"twitch", bg:"#9146ff", fg:"#ffffff", color:"#9d6bff",

    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol || .05, t0 + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

/* col puntatore il riquadro a fuoco si inclina verso la mano, come su una tv box */

  var r = t.getBoundingClientRect();
  var px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
  t.style.setProperty("--ry", (px * 9).toFixed(2) + "deg");
  t.style.setProperty("--rx", (-py * 9).toFixed(2) + "deg");
}

var shelfTimer = null;

  var t = tiles[tileIdx]; if (!t) return;

  scrollToFocus();

     premuta una freccia non si ricostruisce a ogni passo. */

}

/* Riga 0: si vede lo scaffale. Dalla riga 1 in giu' lo scaffale esce e la

/* TVMaze: gratuito, senza chiave. Si leggono gli ultimi 5 giorni di uscite in
   streaming e si tengono solo i servizi che abbiamo, una serie una volta
   sola. Il risultato ridotto resta in memoria 12 ore: sono 1,7 MB di JSON,
   non vanno riscaricati a ogni avvio. */
function loadShelf(){
  var wanted = {};
  Object.keys(APPS).forEach(function(k){ (APPS[k].tvmaze || []).forEach(function(n){ wanted[n] = 1; }); });
  try {
    var c = JSON.parse(localStorage.getItem("home.shelf") || "null");
    if (c && Date.now() - c.t < 12*3600*1000){ SHELF = c.d; paintShelf(); return; }
  } catch(e){}
  if (!IS_TV){ useSample(); }
  if (typeof fetch !== "function") return;

  var acc = {}, seen = {}, day = 0, got = 0;
  function next(){
    if (day > 4){
      if (got){ SHELF = acc; shelfIsSample = false;
        try { localStorage.setItem("home.shelf", JSON.stringify({ t:Date.now(), d:acc })); } catch(e){}
        paintShelf(); }
      return;
    }
    var d = new Date(Date.now() - day*86400000), iso = d.toISOString().slice(0,10);
    day++;
    fetch("https://api.tvmaze.com/schedule/web?date=" + iso).then(function(r){ return r.json(); }).then(function(list){
      (list || []).forEach(function(e){
        var s = e && e._embedded && e._embedded.show; if (!s || seen[s.id]) return;
        var ch = s.webChannel && s.webChannel.name; if (!ch || !wanted[ch]) return;
        seen[s.id] = 1; got++;
        (acc[ch] = acc[ch] || []).push({
          n: s.name, i: s.image && s.image.medium ? s.image.medium.replace(/^http:/, "https:") : "",
          e: (e.season && e.number) ? "S" + e.season + " · E" + e.number : "" });
      });
      /* si mostra subito cio' che c'e', senza aspettare tutti e cinque i giorni */
      if (got){ SHELF = acc; shelfIsSample = false; paintShelf(); }
      next();
    }).catch(function(){ next(); });
  }
  setTimeout(next, 1200);
}
function useSample(){
  SHELF = {}; shelfIsSample = true;
  Object.keys(SAMPLE).forEach(function(k){ SHELF[k] = SAMPLE[k].map(function(n){ return { n:n, i:"", e:"" }; }); });
  paintShelf();
}

/* ==========================================================================
   NAVIGAZIONE SPAZIALE — guarda le posizioni reali, non gli indici
   ========================================================================== */
function move(dx,dy){
  if (tiles.length < 2) return;
  var a = tiles[tileIdx].getBoundingClientRect(), overlap = [], cone = [];
  tiles.forEach(function(t,i){
    if (i === tileIdx) return;
    var b = t.getBoundingClientRect();
    var gap = dx ? (dx > 0 ? b.left - a.right : a.left - b.right)
                 : (dy > 0 ? b.top - a.bottom : a.top - b.bottom);
    if (gap < -2) return;
    var over = dx ? Math.min(a.bottom,b.bottom) - Math.max(a.top,b.top)
                  : Math.min(a.right,b.right)  - Math.max(a.left,b.left);
    var ac = dx ? a.top + a.height/2 : a.left + a.width/2;
    var bc = dx ? b.top + b.height/2 : b.left + b.width/2;
    var drift = Math.abs(bc - ac);
    if (over > a.height * .3) overlap.push({ i:i, score:gap*1000 + drift });
    else                      cone.push({ i:i, score:gap + drift*3 });
  });
  /* i vicini allineati vincono; sull'ultima riga incompleta, "giu'" da una
     colonna vuota scende comunque sull'ultimo riquadro */
  var pool = overlap.length ? overlap : (dy > 0 ? cone : []);
  if (!pool.length){ sndEdge(); return; }
  pool.sort(function(p,q){ return p.score - q.score; });
  tileIdx = pool[0].i;
  var t = tiles[tileIdx]; t.style.removeProperty("--rx"); t.style.removeProperty("--ry");
  paintFocus(); sndMove();
}

function setMode(i){
  if (i === modeIdx) return;
  modeIdx = i; tileIdx = 0;
  try { localStorage.setItem("home.mode", MODES[i].id); } catch(e){}
  modesEl.querySelectorAll(".mode").forEach(function(n,k){ n.classList.toggle("on", k === i); });
  moveThumb(); renderGrid(); sndMode();
}

/* ==========================================================================
   LANCIO
   Prima l'app nativa (identificativo trovato sulla TV, poi quelli noti),
   poi il browser della TV, poi l'indirizzo qui dentro. Guardia a 3 s.
   ========================================================================== */
var toastT = null;
function toast(txt){
  var el = $("#toast"); el.textContent = txt; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("on"); }, 2600);
}
function luna(){
  return (window.webOS && window.webOS.service && window.webOS.service.request) ? window.webOS.service : null;
}
function launch(){
  var t = tiles[tileIdx], a = t && t.__app; if (!a) return;
  t.classList.remove("go"); void t.offsetWidth; t.classList.add("go");
  sndGo();
  window.__H.launched.push(a.name);

  if (a.internal){ setTimeout(function(){ location.href = a.url; }, 240); return; }
  var svc = luna();
  if (!IS_TV || !svc){ toast("Sulla TV si apre " + a.name); return; }

  var ids = (a.found ? [a.found] : []).concat(a.ids || []), done = false;
  function finish(){ done = true; clearTimeout(guard); }
  function web(){
    if (done) return; finish();
    if (a.url) location.href = a.url; else toast(a.name + " non è disponibile su questa TV");
  }
  var guard = setTimeout(web, 3000);
  function viaBrowser(){
    if (!a.url){ web(); return; }
    try {
      svc.request("luna://com.webos.applicationManager", { method:"launch",
        parameters:{ id:"com.webos.app.browser", params:{ target:a.url } },
        onSuccess:finish, onFailure:web });
    } catch(e){ web(); }
  }
  function tryId(k){
    if (k >= ids.length){ viaBrowser(); return; }
    try {
      svc.request("luna://com.webos.applicationManager", { method:"launch",
        parameters:{ id:ids[k], params:{} },
        onSuccess:finish, onFailure:function(){ tryId(k + 1); } });
    } catch(e){ tryId(k + 1); }
  }
  tryId(0);
}

/* Se la TV lo concede, si chiede l'elenco delle app installate e si
   riconoscono le nostre dal nome: cosi' gli identificativi sono quelli veri
   di questa TV. Se lo nega, restano quelli scritti in APPS. */
function discover(){
  var svc = luna(); if (!IS_TV || !svc) return;
  try {
    svc.request("luna://com.webos.applicationManager", { method:"listLaunchPoints", parameters:{},
      onSuccess:function(r){
        var pts = (r && r.launchPoints) || [], n = 0;
        Object.keys(APPS).forEach(function(k){
          var a = APPS[k]; if (!a.find) return;
          for (var i = 0; i < pts.length; i++){
            var title = String(pts[i].title || "").toLowerCase();
            if (a.find.some(function(f){ return title.indexOf(f) > -1; }) &&
                !(k === "youtube" && title.indexOf("music") > -1)){ a.found = pts[i].id; n++; break; }
          }
        });
        window.__H.found = n;
      },
      onFailure:function(){ window.__H.found = -1; } });
  } catch(e){}
}

/* ==========================================================================
   TASTI
   ========================================================================== */
document.addEventListener("keydown", function(e){
  var k = e.keyCode;
  if (wake()){ e.preventDefault(); return; }
  for (var i = 0; i < MODES.length; i++){
    if (k === MODES[i].key || k === 49 + i){ setMode(i); e.preventDefault(); return; }
  }
  switch(k){
    case 37: move(-1,0); break;
    case 39: move(1,0);  break;
    case 38: move(0,-1); break;
    case 40: move(0,1);  break;
    case 13: launch();   break;
    case 48: cyclePerf(); break;
    case 77: toggleSound(); break;
    case 461: case 27:                       /* indietro: si torna in cima */
      if (tileIdx !== 0){ tileIdx = 0; paintFocus(); sndMove(); } break;
    default: return;
  }
  e.preventDefault();
}, false);

  82:["rovesci forti","rain"], 95:["temporale","storm"], 96:["temporale","storm"], 99:["temporale","storm"] };
var WXI = {
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.1M12 19.5v2.1M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2.4 12h2.1M19.5 12h2.1M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.2a3.8 3.8 0 0 0 .3-7.6 5.6 5.6 0 0 0-10.8-1.3A4.4 4.4 0 0 0 7 18.5z"/></svg>',
  rain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5h10.2a3.8 3.8 0 0 0 .3-7.6A5.6 5.6 0 0 0 6.7 6.6 4.4 4.4 0 0 0 7 15.5z"/><path d="M9 18.4l-.8 2.4M13 18.4l-.8 2.4M17 18.4l-.8 2.4"/></svg>',
  snow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3.6v16.8M5 7.5l14 9M19 7.5l-14 9"/></svg>',
  storm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14.6h10.2a3.8 3.8 0 0 0 .3-7.6A5.6 5.6 0 0 0 6.7 5.7 4.4 4.4 0 0 0 7 14.6z"/><path d="M12.6 16.4l-2.2 3.3h2.9l-1.6 2.6"/></svg>' };
function setWeather(temp,label,icon){
  $("#wxTemp").innerHTML = Math.round(temp) + "&deg;";
  $("#wxDesc").textContent = label;
  $("#wxIcon").innerHTML = WXI[icon] || WXI.cloud;
}
function loadWeather(){
  if (!IS_TV) setWeather(17, "nuvole sparse", "cloud");      /* esempio in anteprima */
  if (typeof fetch !== "function") return;
  try {
    fetch("https://api.open-meteo.com/v1/forecast?latitude=" + PLACE.lat + "&longitude=" + PLACE.lon +
          "&current=temperature_2m,weather_code&timezone=auto")
      .then(function(r){ return r.json(); }).then(function(j){
        var c = j && j.current; if (!c) return;
        var w = WX[c.weather_code] || ["", "cloud"]; setWeather(c.temperature_2m, w[0], w[1]);
      }).catch(function(){});
  } catch(e){}
}

/* ==========================================================================
   RESA — se la TV fatica, lo sfondo si ferma. Il tasto 0 lo decide a mano.
   ========================================================================== */
var LEVELS = ["glass","static"], LEVEL_NAME = { glass:"animato", static:"fermo" };
function setPerf(level,note){
  document.documentElement.setAttribute("data-perf", level);
  $("#perfTag").textContent = note ? LEVEL_NAME[level] + " · " + note : "";
  try { localStorage.setItem("home.perf", level); } catch(e){}
}
function cyclePerf(){
  var cur = document.documentElement.getAttribute("data-perf");
  setPerf(LEVELS[(LEVELS.indexOf(cur) + 1) % LEVELS.length], "manuale");
}
function autoTune(){
  var f = 0, t0 = 0;
  requestAnimationFrame(function step(t){
    if (!t0) t0 = t; f++;
    if (t - t0 < 1500) requestAnimationFrame(step);
    else { var fps = f*1000/(t - t0); window.__H.fps = Math.round(fps); if (fps < 26) setPerf("static","auto"); }
  });
}

/* ==========================================================================
   AVVIO
   ========================================================================== */
window.__H = { launched:[], found:0, fps:0,
  get focus(){ return tiles[tileIdx] && tiles[tileIdx].__app.name; },
  get count(){ return tiles.length; }, get shelf(){ return SHELF; } };

(function init(){
  sizeStage();
  window.addEventListener("resize", function(){ sizeStage(); moveThumb(); scrollToFocus(); paintShelf(); });
  try {
    var saved = localStorage.getItem("home.mode");
    if (saved) MODES.forEach(function(m,i){ if (m.id === saved) modeIdx = i; });
    if (localStorage.getItem("home.snd") === "0"){ SND.on = false; $("#sndTag").classList.add("off"); }
  } catch(e){}

  renderModes(); renderGrid(); tick(); loadWeather(); loadShelf(); discover(); wake();
  setInterval(tick, 15000);
  setInterval(loadWeather, 15*60*1000);
  document.addEventListener("mousemove", wake, { passive:true });
  document.addEventListener("click", wake, { passive:true });

  var sp = null;
  try { sp = localStorage.getItem("home.perf"); } catch(e){}
  if (sp === "static") setPerf("static", null); else setTimeout(autoTune, 900);

  document.body.setAttribute("tabindex","-1");
  try { window.focus(); document.body.focus(); } catch(e){}
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ moveThumb(); scrollToFocus(); });
})();
</script>
