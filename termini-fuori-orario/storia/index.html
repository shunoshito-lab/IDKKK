<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Il conto delle croci</title>
<style>
  :root{--bg:#020708;--ink:#c9fff3;--dim:#6fa79e;--aqua:#38e6c6;--line:#1f8f7b;color-scheme:dark}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'VT323','Courier New',monospace;font-size:21px;min-height:100%}
  body{display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;box-sizing:border-box}
  h1{font-family:'Silkscreen','Courier New',monospace;font-size:clamp(20px,5vw,34px);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px;text-align:center}
  .sub{color:var(--dim);margin:0 0 18px;text-align:center}
  #stage{position:relative;width:min(640px,100%);aspect-ratio:4/3;background:#010506;border:2px solid var(--line);overflow:hidden}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  #cap{width:min(640px,100%);margin-top:16px;min-height:9em;line-height:1.3}
  #cap h2{font-family:'Silkscreen','Courier New',monospace;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--aqua);margin:0 0 8px;font-weight:400}
  #cap p{margin:0 0 10px;white-space:pre-line}
  .row{display:flex;gap:10px;width:min(640px,100%);margin-top:12px;align-items:center;flex-wrap:wrap}
  button{font-family:'VT323','Courier New',monospace;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--aqua);background:var(--bg);border:2px solid var(--aqua);padding:4px 16px;cursor:pointer;border-radius:0}
  button:disabled{opacity:.4;cursor:default}
  button:hover:not(:disabled){background:var(--aqua);color:var(--bg)}
  .meta{color:var(--dim);font-size:17px;margin-left:auto}
  audio{width:100%;margin-top:10px;filter:invert(1) hue-rotate(150deg);opacity:.85}
  .note{color:var(--dim);font-size:16px;width:min(640px,100%);margin-top:18px;line-height:1.25}
</style>

<h1>Il conto delle croci</h1>
<p class="sub">Termini · 03:12 · dopo l'ultimo treno</p>

<div id="stage"><canvas id="cv" width="320" height="240"></canvas></div>

<div id="cap"><h2 id="ch"></h2><p id="ct"></p></div>

<div class="row">
  <button id="prev" type="button">&lt; Indietro</button>
  <button id="next" type="button">Avanti &gt;</button>
  <span class="meta" id="pos"></span>
</div>
<audio id="au" controls preload="none"></audio>
<p class="note">Musica ed effetti di terzi: uso personale, non pubblicare senza diritti.</p>

<script>
/* ---- storia: sei capitoli, ognuno con un'intensità di deformazione e una traccia */
const CH=[
 {h:'01 · Turno',t:'Il buttafuori lavora a Termini dopo l\'ultimo treno.\nNessuno sa come sia stato assunto. Nessuno lo ha visto entrare.\nOgni notte fa il conto delle croci appese. Ne manca sempre una.',
  s:'bot',d:.15,m:0},
 {h:'02 · Telecamere',t:'Lara controlla i monitor della sorveglianza, da sola.\nAl fotogramma 3:12:07 nel corridoio c\'è un uomo fermo, con il dito alzato.\nAl fotogramma successivo il corridoio è vuoto. Il dito è ancora alzato, nel riquadro.',
  s:'bot',d:.4,m:0},
 {h:'03 · Specchio',t:'Il bagno del livello −1 ha un solo specchio che funziona.\nLara ci guarda dentro. Il riflesso arriva con un secondo di ritardo.\nDietro di lei, nel riflesso, la porta si chiude piano.',
  s:'mirror',d:.6,m:1},
 {h:'04 · Quattro cifre',t:'La cassa a codice ha quattro cifre. Lara le trova su quattro fogli.\nSu ognuno c\'è scritto un nome, poi una data, poi la parola «non tornato».\nIl quarto foglio ha la sua calligrafia.',
  s:'mirror',d:.75,m:2},
 {h:'05 · Scale ferme',t:'Le scale mobili dell\'atrio scendono anche da spente.\nIn fondo, il buttafuori la aspetta. Ora sa il suo nome.\nLo ripete piano, come si ripete una regola.',
  s:'bot',d:.9,m:2},
 {h:'06 · Fuori orario',t:'Il turno passa a un nuovo addetto, con una torcia e un fischietto.\nLara è già in strada, all\'alba. Non si volta.\nSul vetro della stazione, un\'impronta di dito, dall\'interno.',
  s:'both',d:.5,m:3}
];
const TRACK=['../assets/music/track1.mp3','../assets/music/track2.mp3','../assets/music/track3.mp3','../assets/music/track4.mp3'];
const SPR={bot:'../assets/img/bot-pixel.png',mirror:'../assets/img/protagonist.png'};

const cv=document.getElementById('cv'),g=cv.getContext('2d');
const img={};
let i=0,amp=0;
for(const k in SPR){img[k]=new Image();img[k].src=SPR[k];}

/* deformazione a fette orizzontali: onda, sfasamento RGB, righe e blocchi che saltano */
function frame(t){
  const W=cv.width,H=cv.height,c=CH[i];
  g.fillStyle='#010506';g.fillRect(0,0,W,H);
  const keys=c.s==='both'?['bot','mirror']:[c.s];
  keys.forEach((k,n)=>{
    const im=img[k];if(!im.complete||!im.naturalWidth)return;
    const w=W*(keys.length>1?.5:.8),h=w*im.naturalHeight/im.naturalWidth;
    const x0=keys.length>1?(n?W*.52:W*.02):(W-w)/2,y0=(H-h)/2;
    const d=c.d*(1+.3*Math.sin(t*.7+n));
    for(let y=0;y<h;y+=2){
      const wob=Math.sin(y*.06+t*3+n)*d*14+(Math.random()<d*.02?(Math.random()-.5)*60*d:0);
      g.globalAlpha=1;
      g.drawImage(im,0,y*im.naturalHeight/h,im.naturalWidth,2*im.naturalHeight/h,x0+wob,y0+y,w,2);
    }
    /* sfasamento cromatico: riga rossa e blu spostate */
    g.globalAlpha=.35*d;g.globalCompositeOperation='lighter';
    g.drawImage(im,x0+3*d*Math.sin(t*2),y0,w,h);
    g.globalCompositeOperation='source-over';g.globalAlpha=1;
  });
  /* scanlines e rumore */
  g.fillStyle='rgba(0,0,0,.22)';for(let y=0;y<H;y+=3)g.fillRect(0,y,W,1);
  for(let k=0;k<40*c.d;k++){g.fillStyle=`rgba(200,255,240,${Math.random()*.25})`;g.fillRect(Math.random()*W,Math.random()*H,1+Math.random()*4,1);}
  requestAnimationFrame(frame);
}

function show(n){
  i=Math.max(0,Math.min(CH.length-1,n));const c=CH[i];
  document.getElementById('ch').textContent=c.h;
  document.getElementById('ct').textContent=c.t;
  document.getElementById('pos').textContent=(i+1)+' / '+CH.length;
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').disabled=i===CH.length-1;
  const au=document.getElementById('au');
  if(au.dataset.m!==String(c.m)){au.src=TRACK[c.m];au.dataset.m=c.m;au.play().catch(()=>{});}
}
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
show(0);
requestAnimationFrame(frame);
</script>
